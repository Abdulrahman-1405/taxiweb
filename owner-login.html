<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Driver Login | Silver Taxi</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/owner.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 380px;
      padding: 35px;
      border-radius: var(--radius-lg, 12px);
    }
    .login-card h1 {
      font-size: 1.4rem;
      margin-bottom: 6px;
    }
    .login-card p.sub {
      color: var(--text-muted);
      margin-bottom: 25px;
      font-size: 0.9rem;
    }
    #login-error {
      display: none;
      background: rgba(220, 38, 38, 0.08);
      color: #dc2626;
      border: 1px solid rgba(220, 38, 38, 0.25);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 15px;
    }
    @media (max-width: 480px) {
      .login-card {
        padding: 26px 22px;
      }
      .login-card h1 {
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <div class="login-wrap">
    <div class="login-card glass">
      <h1><i class="fas fa-user-lock" style="color: var(--primary);"></i> Driver Login</h1>
      <p class="sub">Sign in to access the Silver Taxi inquiry dashboard.</p>

      <div id="login-error"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="login-username">Username</label>
          <input type="text" id="login-username" class="form-control" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" required autocomplete="current-password">
        </div>
        <button type="submit" id="login-btn" class="btn btn-primary" style="width:100%; margin-top:10px;">
          <i class="fas fa-sign-in-alt"></i> Log In
        </button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Already logged in? skip straight to the dashboard.
      if (window.TaxiDB.isLoggedIn()) {
        window.location.href = 'owner.html';
        return;
      }

      const form = document.getElementById('login-form');
      const errorBox = document.getElementById('login-error');
      const btn = document.getElementById('login-btn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.style.display = 'none';
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Logging in...';

        const username = document.getElementById('login-username').value.trim();
        const password = document.getElementById('login-password').value;

        try {
          await window.TaxiDB.login(username, password);
          window.location.href = 'owner.html';
        } catch (err) {
          errorBox.textContent = err.message || 'Login failed. Please try again.';
          errorBox.style.display = 'block';
          btn.disabled = false;
          btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Log In';
        }
      });
    });
  </script>
</body>
</html>
